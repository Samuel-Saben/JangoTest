repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace  # Supprime les espaces en fin de ligne
      - id: end-of-file-fixer    # S'assure qu'il y a une ligne vide à la fin du fichier
      - id: check-yaml           # Vérifie la validité des fichiers YAML
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black  # Formate automatiquement le code Python
